# Hierarchical Bayesian degradation model.
#
# Lap time is decomposed as
#   t = circuit_base + driver_offset + fuel(lap) + deg(compound, circuit, age)
# where the fuel term is the part that is confounded with tyre age. See
# DESIGN.md "Fuel-burn identification" for why this is the hard bit.

fuel:
  # Fuel effect is modelled as linear in mass burned, which is linear in laps
  # completed. We do not fix the coefficient a priori; it is estimated, but
  # this prior keeps it in the physically sensible range.
  #
  # Regulation start mass is 110 kg. Published sensitivity is roughly
  # 0.03 s/lap/kg of lap-time per kg, i.e. ~0.10 s/lap at a typical circuit.
  start_mass_kg: 110.0
  prior_mean_s_per_kg: 0.030
  prior_sd_s_per_kg: 0.012

  # A single global fuel coefficient is shared by every circuit and scaled by
  # that circuit's median green-flag lap time, which is the observable proxy
  # for how much time a kilogram costs there. Pooling the effect that is
  # physically common while leaving degradation free per circuit is what makes
  # the separation from tyre age stable. See degradation/design.py.
  pool_across_circuits: true

degradation:
  # Curve shape per compound. "linear" is a constant loss per lap of age.
  # "quadratic" adds a convex term for the cliff. We fit both and report the
  # comparison in the model card; quadratic is the default.
  shape: quadratic

  # Age is centred and scaled so the intercept means "pace on a fresh tyre"
  # and the priors below are on a comparable scale across circuits.
  age_scale_laps: 20.0

sampler:
  # Conditionally-conjugate Gibbs sampler, see pitwall/degradation/gibbs.py.
  # Every full conditional is available in closed form, so there is no tuning
  # and no compiler dependency.
  # Gibbs draws are cheap here (a sweep is a few vectorised passes) but mix
  # more slowly than HMC would, so the budget is spent on draws rather than on
  # tuning. These settings clear Rhat < 1.01 and ESS > 400 on the full
  # four-season fit; a short run will not, and the diagnostics say so.
  # The fuel coefficient and the per-circuit track-evolution terms are drawn
  # in one joint block because they are exactly collinear within a race, but
  # they stay correlated with the compound offsets, and that residual ridge is
  # what sets the mixing rate. Gibbs sweeps are cheap here, so the budget goes
  # on draws: these settings clear Rhat < 1.01 and ESS > 400 on the full fit.
  chains: 4
  draws: 16000
  warmup: 3000
  thin: 2

priors:
  # Population-level (across-circuit) mean and spread for each compound's
  # degradation coefficients. Coefficients are on the scaled-age axis, so a
  # linear coefficient of 1.0 means one second lost over age_scale_laps laps.
  mu_deg_mean: 0.0
  mu_deg_sd: 2.0
  # Half-Cauchy scale on the between-circuit sd, per coefficient:
  # [compound offset, linear wear, quadratic wear]. The quadratic is tight on
  # purpose; see the note in degradation/gibbs.py.
  tau_deg_scale: [0.50, 0.50, 0.15]
  # Per-circuit track evolution, in seconds across a full race distance.
  # Collinear with fuel inside a single race; the two are separated by the
  # fuel coefficient being global and this one being per circuit.
  track_evolution_sd: 3.0
  driver_sd_scale: 0.40    # half-Cauchy scale on driver random-effect sd
  sigma_scale: 0.50        # half-Cauchy scale on residual lap-time sd

diagnostics:
  # Fit is rejected if any monitored parameter breaches these.
  max_rhat: 1.01
  min_ess: 400
