[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "Formula 1 race strategy simulator and Monte Carlo optimizer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hellblazer704" }]

dependencies = [
    "fastf1>=3.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitwall = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that run full Monte Carlo ensembles",
    "network: tests that need the FastF1 API (skipped in CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning:fastf1.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",
    "NPY",       # numpy legacy random / api
]
ignore = [
    "N803",  # design-matrix args are conventionally uppercase (X, A)
    "N806",  # same, for locals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# Deliberately not pinning python_version. Pinning it to 3.11 makes mypy parse
# numpy 2.x stubs (which use 3.12 `type` statements) under 3.11 grammar, and it
# dies with a syntax error when CI runs the 3.12 job.
packages = ["pitwall"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

# pandas-stubs cannot follow a groupby/agg/rename chain: it collapses the
# element type and then reports things like `Series[bool] + str` on a string
# concatenation, or rejects `rename(columns=...)` on what it has decided is a
# Series. These are stub limitations rather than defects, and the modules below
# are the ones doing heavy dataframe reshaping.
#
# Scoped per module rather than turned off globally, and only for the codes the
# stubs actually get wrong. Signatures are still checked everywhere, and the
# numerical core (gibbs, engine, mc) stays fully typed.
[[tool.mypy.overrides]]
module = [
    "pitwall.ingest.clean",
    "pitwall.ingest.circuits",
    "pitwall.degradation.design",
    "pitwall.sim.field",
    "pitwall.validate.backtest",
]
disable_error_code = ["operator", "call-overload", "misc", "attr-defined", "arg-type"]
